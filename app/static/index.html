<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legalese Translator</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0}
header{padding:20px 28px;border-bottom:1px solid #334155}
header h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:#94a3b8;font-size:13px}
main{max-width:1080px;margin:0 auto;padding:20px 28px;display:grid;gap:16px}
.card{background:#1e293b;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
textarea{width:100%;min-height:170px;background:#0b1220;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;font-size:14px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
select,button{padding:9px 14px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:#e2e8f0;font-size:14px;cursor:pointer}
button.primary{background:#38bdf8;color:#0b1220;border:none;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:6px}
.stat{background:#0b1220;border-radius:8px;padding:8px}.stat .label{color:#94a3b8;font-size:11px}.stat .value{font-size:17px;font-weight:600;margin-top:2px}
.rewritten{white-space:pre-wrap;line-height:1.6}
.bullet{padding:9px 11px;border-left:3px solid #38bdf8;background:#0b1220;border-radius:6px;margin-bottom:7px}
.bullet .src{color:#94a3b8;font-size:11px;margin-top:3px}
.risk{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;margin-left:6px}
.risk.low{background:#064e3b;color:#a7f3d0}.risk.medium{background:#78350f;color:#fde68a}
.risk.high{background:#7f1d1d;color:#fecaca}.risk.critical{background:#7f1d1d;color:#fff}
.hit{display:inline-block;background:#1e3a8a;color:#bfdbfe;padding:1px 6px;border-radius:4px;font-size:11px;margin:2px}
.error{color:#ef4444}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Legalese Translator</h1><p>Spellcheck for corporate legalese — highlights dense phrases and translates them into plain English.</p></header>
<main>
<div class="card"><textarea id="text" placeholder="Paste a contract, terms of service, privacy policy..."></textarea>
<div class="row"><select id="domain"><option value="">All domains</option><option value="general">General</option><option value="saas">SaaS / Tech</option><option value="finance">Finance</option><option value="healthcare">Healthcare</option><option value="realestate">Real Estate</option></select>
<button class="primary" id="translate">Translate</button><span id="status"></span></div></div>
<div class="two"><div class="card"><h2>Rewritten</h2><div id="rewritten" class="rewritten">Translation will appear here.</div></div>
<div class="card"><h2>Plain-English breakdown</h2><div id="bullets"></div></div></div>
<div class="card"><h2>Stats</h2><div id="stats" class="stats"></div></div>
<div class="card"><h2>Detected jargon</h2><div id="hits"></div></div>
</main>
<script>
const btn=document.getElementById('translate'),status=document.getElementById('status');
btn.addEventListener('click',async()=>{
 const text=document.getElementById('text').value.trim();
 if(!text){status.textContent='Paste some text first.';status.className='error';return;}
 status.textContent='Translating...';status.className='';btn.disabled=true;
 try{
  const res=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,domain:document.getElementById('domain').value||null})});
  if(!res.ok)throw new Error(await res.text());
  const data=await res.json();
  document.getElementById('rewritten').textContent=data.rewritten;document.getElementById('rewritten').className='rewritten';
  const bullets=document.getElementById('bullets');bullets.innerHTML='';
  for(const b of data.bullets){const div=document.createElement('div');div.className='bullet';div.innerHTML='<div>'+esc(b.text)+'</div><div class="src">'+esc(b.source)+'</div>';bullets.appendChild(div);}
  const stats=document.getElementById('stats');stats.innerHTML='';
  const s=data.stats;const items=[['Words',s.words],['Sentences',s.sentences],['Jargon hits',s.jargon_hits],['Unique terms',s.unique_terms],['Density',s.density+'%'],['Grade before',s.reading_level_before],['Grade after',s.reading_level_after]];
  for(const [k,v] of items){const d=document.createElement('div');d.className='stat';d.innerHTML='<div class="label">'+k+'</div><div class="value">'+v+'</div>';stats.appendChild(d);}
  const hits=document.getElementById('hits');hits.innerHTML='';
  for(const h of data.hits){const span=document.createElement('span');span.className='hit';span.title=h.definition;span.textContent=h.surface+' → '+h.short;hits.appendChild(span);}
  status.textContent='Found '+data.hits.length+' jargon hit(s).';
 }catch(e){status.textContent='Error: '+e.message;status.className='error';}
 finally{btn.disabled=false;}
});
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
