[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalese-translator"
version = "0.1.0"
description = "A jargon-to-plain-English translator for regulatory and legal documents, powered by a semantic jargon dictionary and a contextual replacer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Legalese Translator contributors" }]
keywords = ["legal", "nlp", "plain-english", "accessibility", "compliance", "jargon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional: swap the built-in rule engine for spaCy-powered NER + dependency
# parsing. The app auto-detects spaCy at runtime; without it, the lightweight
# rule engine is used instead.
spacy = ["spacy>=3.7"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
legalese = "legalese.cli:main"

[project.urls]
Homepage = "https://github.com/Ksinghania2/legalese-translator"
Issues = "https://github.com/Ksinghania2/legalese-translator/issues"

[tool.setuptools]
packages = ["legalese", "app"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
